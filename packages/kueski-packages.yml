summary: >-
  Kueski ships no conventional server-side API client library in any language. Its distribution
  model is e-commerce platform plugins plus a browser widget bundle: a merchant installs a
  first-party plugin for their storefront platform, or drops in the widgets.js script. Searches of
  npm, PyPI, Packagist, RubyGems and crates.io return no first-party Kueski client library. The
  packages below are the real, first-party, publicly distributable artifacts Kueski does publish.
