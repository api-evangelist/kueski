gaps:
- No server-side SDK in any language. A merchant not on one of the seven supported storefront
  platforms must hand-roll HTTP against an API that has no published specification.
- widgets.js is unversioned at the URL and offers no SRI/integrity hash, so merchants embed a
  mutable third-party script into their checkout with no pinning option.
- No public source repository for any of the plugins; the WooCommerce plugin's source is only
  obtainable by unpacking the distributed WordPress.org zip.
