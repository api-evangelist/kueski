  authority: Mexico
- id: mx-condusef-sipres
  conforms: true
  evidence: >-
    Registered in CONDUSEF's SIPRES registry; Kueski links merchants and consumers to
    https://webapps.condusef.gob.mx/SIPRES/jsp/pub/index.jsp from its own site.
  authority: CONDUSEF (Mexico)
- id: mx-buro-de-entidades-financieras
  conforms: true
  evidence: Kueski publishes a Buro de Entidades Financieras link (www.buro.gob.mx) on its own site.
  authority: Mexico
- id: mx-lfpdppp-privacy-notice
  conforms: true
  evidence: >-
    Published aviso de privacidad integral for customers and a separate privacy notice for third
    parties and commercial allies, as required under Mexico's federal data protection law.
gaps:
- No machine-readable API contract of any kind, in any format.
- No standards-based authorization; opaque bearer keys only, with no scopes and no delegation.
- Error handling conforms to neither RFC 9457 nor RFC 9110 status semantics.
- No security.txt, no api-catalog, no agent card, no llms.txt.
- Security certifications are unverifiable from any first-party public surface.
