apis:
- aid: kueski:kueski-pay-widget-configuration-api
  name: Kueski Pay Widget Configuration API
  description: 'The HTTP API behind the Kueski Pay merchant widgets. The widgets.js library
    authenticates with the merchant public key as an HTTP bearer token and reads merchant
    configuration and installment-messaging data used to render the product and cart widgets.
    Separate production and testing (sandbox) hosts are selected by the widget sandbox parameter.'
  humanURL: https://www.kueskipay.com/guias-de-integracion
  baseURL: https://api.kueskipay.com
  tags:
  - Payments
  - Buy Now Pay Later
  - Widgets
  - Checkout
  - Configuration
  properties:
  - type: Documentation
    url: https://github.com/kueski-dev/Dev-Center/wiki
  - type: Authentication
    url: authentication/kueski-authentication.yml
  - type: ErrorCatalog
    url: errors/kueski-problem-types.yml
- aid: kueski:kueski-pay-merchant-orders-api
  name: Kueski Pay Merchant Orders API
  description: 'The merchant-facing Kueski Pay order API used by the first-party e-commerce
    plugins. It validates merchant API keys, creates a Kueski Pay order and returns a hosted
    checkout callback URL for redirect, synchronizes the status of previously created orders
    (merchants poll; Kueski publishes no webhook surface), and issues full or partial refunds
    against a payment. Authentication is an HTTP bearer token carrying the merchant API key.'
  humanURL: https://github.com/kueski-dev/Dev-Center/wiki/WooCommerce
  baseURL: https://woocommerce-middleware-go.production-pay.kueski.com/api/v1
