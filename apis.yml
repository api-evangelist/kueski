description: 'Kueski is a Mexican financial technology company founded in 2012 and headquartered
  in Guadalajara, Jalisco, offering online consumer credit across Mexico. Its flagship product,
  Kueski Pay, is a buy-now-pay-later (BNPL) payment method that lets shoppers buy without a credit
  card and repay in biweekly installments at thousands of online and physical merchants. Kueski also
  offers personal loans and cash advances. For merchants, Kueski Pay is distributed as e-commerce
  platform plugins (WooCommerce, Shopify, VTEX IO, Magento, PrestaShop, Tiendanube, T1 Paginas)
  plus a JavaScript widget library and a bearer-token HTTP merchant API for order creation, order
  synchronization and refunds. Kueski operates as a SOFOM E.N.R. regulated entity registered with
  Mexico''s CONDUSEF.'
